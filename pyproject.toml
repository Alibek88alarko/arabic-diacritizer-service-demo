[project]
name = "arabic-diacritizer-service-demo"
version = "0.1.0"
description = "Arabic diacritizer API demo: strict validator, LLM routing with fallback and cost caps, correction capture, native Windows service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
